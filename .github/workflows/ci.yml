name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - run: ruff check .

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-smoke-test:
    name: Build image and verify it actually serves traffic
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t task-tracker-api:ci .
      - name: Run container
        run: docker run -d -p 8080:8080 --name ci-container task-tracker-api:ci
      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 15); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-container || echo "unknown")
            echo "attempt $i: health status = $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy — dumping