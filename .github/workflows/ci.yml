name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r app/requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v

  build-and-smoke-test:
    name: Build image and verify it actually serves traffic
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t task-tracker-api:ci .

      - name: Run container
        run: docker run -d -p 8080:8080 --name ci-container task-tracker-api:ci

      - name: Wait for the container to report healthy
        run: |
          for i in $(seq 1 15); do
            status=$(docker inspect --format='{{.State.Health.Status}}' ci-container || echo "unknown")
            echo "attempt $i: health status = $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 2
          done
          echo "Container never became healthy — dumping logs for diagnosis:"
          docker logs ci-container
          exit 1

      - name: Smoke-test the API from outside the container
        run: |
          curl --fail --silent --show-error http://localhost:8080/health
          curl --fail --silent --show-error http://localhost:8080/tasks

      - name: Show logs (always, for visibility in the Actions run)
        if: always()
        run: docker logs ci-container

      - name: Clean up
        if: always()
        run: docker rm -f ci-container
